<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Mandiri: Form Pemesanan Barang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .browser-mockup {
            width: 680px;
            background-color: #ffffff;
            border: 1px solid #999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* Top Navigation Bar Mockup */
        .browser-header {
            background-color: #e0e0e0;
            padding: 8px 10px;
            border-bottom: 1px solid #999;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .browser-header span {
            font-size: 18px;
            color: #555;
            cursor: pointer;
            padding: 0 2px;
        }
        .address-bar {
            background-color: #fff;
            border: 1px solid #aaa;
            flex-grow: 1;
            padding: 2px 8px;
            font-size: 12px;
            color: #777;
            height: 18px;
        }
        /* Main Content Container */
        .content {
            padding: 25px;
        }
        /* Menu Links Baru */
        .menu-nav {
            text-align: center;
            margin-bottom: 25px;
            font-size: 11px;
            font-weight: bold;
        }
        .menu-nav a {
            text-decoration: none;
            color: #000;
            margin: 0 8px;
        }
        /* Form Table Layout */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        td {
            padding: 5px 4px;
            vertical-align: top;
        }
        .label-cell {
            white-space: nowrap;
            width: 130px;
            text-align: right;
            padding-right: 10px;
        }
        /* Image Box & Upload Button */
        .image-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 140px;
        }
        .image-box {
            width: 120px;
            height: 120px;
            border: 1px solid #000;
            position: relative;
        }
        .image-box::before, .image-box::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }
        .image-box::before {
            background: linear-gradient(to top right, transparent calc(50% - 1px), #000, transparent calc(50% + 1px));
        }
        .image-box::after {
            background: linear-gradient(to top left, transparent calc(50% - 1px), #000, transparent calc(50% + 1px));
        }
        .btn-upload {
            font-size: 11px;
            padding: 2px 8px;
            cursor: pointer;
            border: 1px solid #777;
            background-color: #f0f0f0;
        }
        /* Form Inputs Styling */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 4px;
            border: 1px solid #000;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 12px;
        }
        textarea {
            resize: none;
            height: 80px;
        }
        .select-small {
            width: 60px;
        }
        .checkbox-container {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .info-text {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
            display: block;
        }
        /* Submit Button */
        .btn-container {
            text-align: center;
            margin-top: 25px;
        }
        .btn-submit {
            background-color: #008000;
            color: #ffffff;
            border: 1px solid #004d00;
            padding: 6px 15px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #006400;
        }
    </style>
</head>
<body>

<div class="browser-mockup">
    <!-- Header simulasi tampilan browser -->
    <div class="browser-header">
        <span>⌂</span>
        <span>⇐</span>
        <span>⇒</span>
        <span>↻</span>
        <div class="address-bar">http://</div>
    </div>

    <!-- Konten Formulir Utama -->
    <div class="content">
        <!-- Menu Navigasi Sesuai Gambar 3 -->
        <div class="menu-nav">
            <a href="#">Home</a> | 
            <a href="#">Generate Link</a> | 
            <a href="#">Transaction History</a> | 
            <a href="#">Policy</a> | 
            <a href="#">Logout</a>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            <table>
                <tr>
                    <!-- Area Gambar Khusus Desain Baru -->
                    <td rowspan="7" style="width: 150px;">
                        <div class="image-area">
                            <div class="image-box"></div>
                            <input type="file" id="file-upload" style="display:none;">
                            <button type="button" class="btn-upload" onclick="document.getElementById('file-upload').click()">Upload Picture</button>
                        </div>
                    </td>
                    <td class="label-cell">Title Here :</td>
                    <td>
                        <select name="Tatle">
                          <option value="" disabled selected>Pilih Playtation yang ingin di beli</option>
                          <option value="Playtation 2">Playtation 2 Rp. 1000.000</option>
                          <option value="Playtation 3">Playtation 3 Rp. 3000.000</option>
                          <option value="Playtation 4">Playtation 4 Rp. 6000.000</option>
                          <option value="Playtation 5">Playtagion 5 Rp. 8000.000</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Description :</td>
                    <td>
                        <textarea name="description" placeholder="Masukkan deskripsi (contoh: Year: 2008, Model: slim, Condition: mulus no lecet)"></textarea>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Account Number :</td>
                    <td>
                        <input type="text" name="account_number" placeholder="Masukkan nomor akun Anda">
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Bank :</td>
                    <td>
                        <select name="bank">
                            <option value="" disabled selected>Pilih Bank</option>
                            <option value="BSI">BSI</option>
                            <option value="bca">BCA</option>
                            <option value="mandiri">Mandiri</option>
                            <option value="BRI">BRI</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Account Holder :</td>
                    <td>
                        <input type="text" name="account_holder" placeholder="Masukkan nama pemilik akun">
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">Transaction :</td>
                    <td>
                        <select name="transaction" class="select-small">
                            <option value="" disabled selected>0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <div class="checkbox-container">
                            <input type="checkbox" id="send_mobile" name="send_mobile">
                            <label for="send_mobile">Send to Mobile Phone</label>
                        </div>
                        <div class="checkbox-container">
                            <input type="checkbox" id="send_email" name="send_email">
                            <label for="send_email">Send to Email</label>
                        </div>
                    </td>
                </tr>

                <!-- Form Tujuan Pengiriman Data -->
                <tr>
                    <td></td>
                    <td class="label-cell">Send to Mobile Phone :</td>
                    <td>
                        <input type="text" name="mobile_phone" placeholder="Masukkan nomor HP tujuan">
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td class="label-cell">Send to Email :</td>
                    <td>
                        <input type="text" name="email" placeholder="Masukkan alamat email tujuan">
                    </td>
                </tr>
            </table>

            <!-- Tombol Kirim Form Sesuai Gambar 3 -->
           <div class="btn-container">
    <button type="button" class="btn-submit" onclick="window.location.href='Action.html'">submit</button>
</div>

            
        </form>
    </div>
</div>

</body>
</html>
